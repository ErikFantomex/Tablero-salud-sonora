name: Pruebas

on: [push, pull_request]

jobs:
  tablero:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: docker compose up --build --wait --wait-timeout 120 app
      - run: docker compose run --rm app python -m pytest tests
      - run: docker compose run --rm -w /project/enigh-sonora-main app python -m pytest tests
      - if: failure()
        run: docker compose logs app
      - if: always()
        run: docker compose down
